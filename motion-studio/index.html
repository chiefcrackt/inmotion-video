<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="../favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
    <meta name="theme-color" content="#0E1A2E" />
    <title>Motion Studio 2 · T.IM Studio</title>
    <link rel="stylesheet" href="../shared/fonts.css?v=70017a07" />
    <link rel="stylesheet" href="../shared/responsive.css?v=bb296b12" />
    <script type="module" src="../shared/studio-bar.mjs?v=6dddf994"></script>
    <link rel="stylesheet" href="../shared/studio-bar.css?v=30ec331d" />
    <style>
      :root {
        --navy: #0e1a2e;
        --panel: #13233d;
        --line: #25395c;
        --gold: #e8c96a;
        --teal: #2e9bad;
        --paper: #f6f4ef;
        --muted: #9fb0c8;
        --danger: #f08a7a;
        --display: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      body {
        margin: 0;
        background: var(--navy);
        color: var(--paper);
        font-family: var(--display);
        font-size: 16px;
        line-height: 1.4;
        padding: 16px;
      }
      h1 {
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin: 8px 0 4px;
        font-size: 28px;
      }
      p.lede { color: var(--muted); margin: 0 0 16px; }
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 16px;
        align-items: start;
      }
      @media (max-width: 760px) {
        .layout { grid-template-columns: 1fr; }
      }
      .stage {
        background: #000;
        border: 1px solid var(--line);
        border-radius: 6px;
        overflow: hidden;
      }
      canvas { display: block; width: 100%; height: auto; }
      .transport {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 10px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-top: 0;
        border-radius: 0 0 6px 6px;
      }
      .transport input[type='range'] { flex: 1; min-width: 0; }
      .time { flex: none; min-width: 72px; text-align: right; white-space: nowrap; color: var(--muted); }
      button {
        font: inherit;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        background: var(--gold);
        color: var(--navy);
        border: 0;
        border-radius: 4px;
        padding: 10px 14px;
        min-height: 44px;
        cursor: pointer;
      }
      button.secondary {
        background: transparent;
        color: var(--paper);
        border: 1px solid var(--line);
      }
      form fieldset {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel);
        margin: 0 0 12px;
        padding: 12px;
      }
      legend {
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--gold);
        padding: 0 6px;
      }
      label {
        display: block;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--muted);
        margin: 8px 0 2px;
      }
      input[type='text'], input[type='number'], select, textarea {
        width: 100%;
        font: inherit;
        color: var(--paper);
        background: var(--navy);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 8px;
        min-height: 40px;
      }
      .check { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
      .check label { margin: 0; text-transform: none; letter-spacing: 0; color: var(--paper); font-size: 16px; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .error { color: var(--danger); min-height: 1.4em; margin: 8px 0; }
      .notes { color: var(--muted); font-size: 14px; margin-top: 16px; }
      .notes code { color: var(--gold); }
    </style>
  </head>
  <body>
    <tim-studio-bar></tim-studio-bar>
    <h1>Motion Studio 2</h1>
    <p class="lede">Build a title card or lower third, preview it here, then export a spec file and render it on your computer.</p>

    <div class="layout">
      <section>
        <div class="stage">
          <canvas id="preview" width="1920" height="1080" aria-label="Motion preview"></canvas>
        </div>
        <div class="transport">
          <button id="play" type="button" class="secondary">Play</button>
          <input id="scrub" type="range" min="0" max="0" step="1" value="0" aria-label="Scrub" />
          <span id="time" class="time">0.00 / 0.00s</span>
        </div>
      </section>

      <form id="controls" autocomplete="off">
        <fieldset>
          <legend>Piece</legend>
          <label for="type">Type</label>
          <select id="type" name="type">
            <option value="title-card">Title card</option>
            <option value="lower-third">Lower third</option>
            <option value="custom">Custom text</option>
          </select>
          <div class="row">
            <div>
              <label for="aspect">Aspect</label>
              <select id="aspect" name="aspect">
                <option value="16:9">16:9</option>
                <option value="9:16">9:16</option>
              </select>
            </div>
            <div>
              <label for="background">Background</label>
              <select id="background" name="background">
                <option value="navy">Navy</option>
                <option value="green">Green screen</option>
              </select>
            </div>
          </div>
          <div class="row">
            <div>
              <label for="duration">Seconds</label>
              <input id="duration" name="duration" type="number" min="2" max="30" step="0.5" />
            </div>
            <div>
              <label for="bpm">BPM</label>
              <input id="bpm" name="bpm" type="number" min="60" max="200" step="1" value="120" />
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend>Text</legend>
          <label for="eyebrow">Eyebrow</label>
          <input id="eyebrow" name="eyebrow" type="text" maxlength="40" placeholder="e.g. Part 2 · Hill Legs" />
          <label for="headline">Headline</label>
          <input id="headline" name="headline" type="text" maxlength="60" placeholder="e.g. Where I Started" required />
          <label for="sub">Sub line</label>
          <input id="sub" name="sub" type="text" maxlength="120" placeholder="Optional" />
        </fieldset>

        <fieldset>
          <legend>Brand</legend>
          <div class="check">
            <input id="brand" name="brand" type="checkbox" checked />
            <label for="brand">T.im brand layer (palette, type, safe zone, waves)</label>
          </div>
        </fieldset>

        <p id="error" class="error" role="alert"></p>
        <button id="export" type="button">Export spec.json</button>
        <p class="notes">
          The spec is the contract: <code>spec.json</code> goes in <code>motion-studio/render/</code>,
          then run <code>npm run render</code> there. Rendering needs Node on your computer.
        </p>
      </form>
    </div>

    <script type="module" src="app.mjs?v=b31f1242"></script>
  </body>
</html>
