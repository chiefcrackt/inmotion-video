<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0e1a2e" />
    <title>Content Planner · T.IM Studio</title>
    <link rel="icon" href="../favicon.svg" />
    <link rel="stylesheet" href="../shared/fonts.css?v=70017a07" />
    <link rel="stylesheet" href="../shared/studio-bar.css?v=30ec331d" />
    <meta http-equiv="refresh" content="0; url=../content-studio/" />
    <script>
      (() => {
        // Keep the query and any video id, so old links still open the right video.
        const target = new URL('../content-studio/', location.href);
        target.search = location.search;
        const id = location.hash.slice(1);
        if (id) target.searchParams.set('videoProject', decodeURIComponent(id));
        else target.hash = location.hash;
        location.replace(target.href);
      })();
    </script>
    <script type="module" src="../shared/studio-bar.mjs?v=a3c25134"></script>
  </head>
  <body>
    <tim-studio-bar></tim-studio-bar>
    <main style="padding:16px;font:16px/1.4 Arial,sans-serif;color:#f6f4ef;background:#0e1a2e;min-height:60vh">
      <p>Content Planner now lives in <a href="../content-studio/" style="color:#e8c96a">Content Studio</a>.</p>
    </main>
  </body>
</html>
