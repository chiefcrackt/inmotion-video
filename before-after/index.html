<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="../favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
    <meta name="theme-color" content="#0E1A2E" />

    <style>
      :root {
        --navy: #0e1a2e;
        --panel: #13233d;
        --line: #25395c;
        --gold: #e8c96a;
        --teal: #2e9bad;
        --muted: #9fb0c8;
        --paper: #f6f4ef;
        --danger: #f08a7a;
        --display: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif;
        --body: 'Barlow Condensed', 'Helvetica Neue', Arial, sans-serif;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--navy); color: var(--paper); font-family: var(--body); }
      [hidden] { display: none !important; }
      a.home { color: var(--muted); text-decoration: none; font: 700 13px var(--display); letter-spacing: 2px; text-transform: uppercase; }
      a.home:hover { color: var(--gold); }
      button, input, select { font: inherit; }
      button {
        min-height: 44px; min-width: 44px; padding: 0 14px; border-radius: 10px;
        border: 1px solid var(--line); background: var(--panel); color: var(--paper);
        font-weight: 700; letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
      }
      button.primary { background: var(--gold); color: var(--navy); border-color: var(--gold); }
      button[aria-pressed="true"] { background: var(--gold); color: var(--navy); border-color: var(--gold); }
      button:disabled { opacity: 0.45; cursor: default; }
      input[type="text"], select {
        width: 100%; min-height: 44px; padding: 8px 12px; border-radius: 10px;
        border: 1px solid var(--line); background: var(--navy); color: var(--paper);
      }
      input[type="range"] { width: 100%; min-height: 44px; accent-color: var(--gold); }
      input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--gold); }
      h1 { margin: 0; font: 700 34px/1 var(--display); letter-spacing: 1px; text-transform: uppercase; }
      .muted { color: var(--muted); font-size: 15px; }
      .wrap { max-width: 1140px; margin: 0 auto; padding: 16px; }
      header { margin-bottom: 16px; }
      .layout { display: grid; gap: 18px; grid-template-columns: 1fr; }
      @media (min-width: 960px) { .layout { grid-template-columns: 380px 1fr; align-items: start; } }
      .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 12px; }
      .panel h2 { margin: 0; font: 700 18px/1 var(--display); letter-spacing: 1.5px; text-transform: uppercase; color: var(--gold); }
      .photo-card { border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: grid; gap: 10px; }
      .photo-head { display: grid; grid-template-columns: 64px 1fr; gap: 10px; align-items: center; }
      .thumb {
        width: 64px; height: 64px; border-radius: 10px; border: 1px dashed var(--line);
        background: var(--navy) center / cover no-repeat;
      }
      .thumb.has { border-style: solid; border-color: var(--teal); }
      .pick { display: grid; gap: 6px; min-width: 0; }
      .file-btn {
        display: flex; align-items: center; justify-content: center; min-height: 48px; padding: 10px 14px;
        border-radius: 12px; border: 1px solid var(--gold); background: transparent; color: var(--gold);
        font: 700 15px/1 var(--display); letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
      }
      .file-btn:active { background: var(--gold); color: var(--navy); }
      .file-btn:focus-within { outline: 2px solid var(--gold); outline-offset: 2px; }
      .sr { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
      .photo-name { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
      .photo-name.err { color: var(--danger); }
      .adjust { display: grid; gap: 8px; }
      .adjust label { display: grid; gap: 4px; font-size: 15px; color: var(--muted); }
      .adjust label span.val { float: right; color: var(--paper); }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .swatches { display: flex; gap: 8px; }
      .swatch { width: 44px; height: 44px; border-radius: 10px; border: 2px solid var(--line); padding: 0; min-width: 0; }
      .swatch[aria-pressed="true"] { border-color: var(--gold); }
      .check { display: flex; gap: 10px; align-items: center; min-height: 44px; }
      .actions { display: grid; gap: 10px; }
      #msg { min-height: 1.4em; margin: 0; font-size: 16px; color: var(--muted); }
      #msg.err { color: var(--danger); }
      .preview { display: grid; gap: 12px; justify-items: center; }
      .mode { display: grid; grid-template-columns: repeat(3, auto); gap: 8px; justify-content: center; }
      #canvas {
        display: block; width: auto; height: auto; max-width: 100%; max-height: 70vh;
        border-radius: 12px; border: 1px solid var(--line); background: #000; touch-action: none;
      }
      #canvas.grab { cursor: grab; }
      #canvas.busy { cursor: progress; }
      .hint { font-size: 15px; color: var(--muted); text-align: center; margin: 0; }
    </style>
  <link rel="stylesheet" href="../shared/studio-bar.css?v=30ec331d" /><script type="module" src="../shared/studio-bar.mjs?v=3e15f76e"></script></head>
  <body><tim-studio-bar></tim-studio-bar>
    <div class="wrap">
      <header>
        <h1>Before &amp; After</h1>
        <p class="muted">Add two photos, frame each one, then export a still or an animation.</p>
      </header>

      <div class="layout">
        <aside class="panel" aria-label="Settings">
          <h2>Photos</h2>

          <div class="photo-card" data-slot="before">
            <div class="photo-head">
              <div class="thumb" id="thumb-before"></div>
              <div class="pick">
                <label class="file-btn" for="file-before">Choose before photo</label>
                <input id="file-before" class="sr" type="file" accept="image/*" />
                <span class="photo-name" id="name-before">No photo yet</span>
              </div>
            </div>
            <div class="adjust">
              <div class="row">
                <button type="button" data-fit="before" data-value="fill" aria-pressed="true">Fill frame</button>
                <button type="button" data-fit="before" data-value="fit" aria-pressed="false">Show whole</button>
              </div>
              <label>Zoom <span class="val" id="zoom-before-v"></span><input id="zoom-before" type="range" min="100" max="300" step="1" /></label>
              <label>Move left / right <span class="val" id="panx-before-v"></span><input id="panx-before" type="range" min="-100" max="100" step="1" /></label>
              <label>Move up / down <span class="val" id="pany-before-v"></span><input id="pany-before" type="range" min="-100" max="100" step="1" /></label>
              <div class="row">
                <button type="button" data-rotate="before">Rotate ↻</button>
                <button type="button" data-reset="before">Reset photo</button>
              </div>
            </div>
          </div>

          <div class="photo-card" data-slot="after">
            <div class="photo-head">
              <div class="thumb" id="thumb-after"></div>
              <div class="pick">
                <label class="file-btn" for="file-after">Choose after photo</label>
                <input id="file-after" class="sr" type="file" accept="image/*" />
                <span class="photo-name" id="name-after">No photo yet</span>
              </div>
            </div>
            <div class="adjust">
              <div class="row">
                <button type="button" data-fit="after" data-value="fill" aria-pressed="true">Fill frame</button>
                <button type="button" data-fit="after" data-value="fit" aria-pressed="false">Show whole</button>
              </div>
              <label>Zoom <span class="val" id="zoom-after-v"></span><input id="zoom-after" type="range" min="100" max="300" step="1" /></label>
              <label>Move left / right <span class="val" id="panx-after-v"></span><input id="panx-after" type="range" min="-100" max="100" step="1" /></label>
              <label>Move up / down <span class="val" id="pany-after-v"></span><input id="pany-after" type="range" min="-100" max="100" step="1" /></label>
              <div class="row">
                <button type="button" data-rotate="after">Rotate ↻</button>
                <button type="button" data-reset="after">Reset photo</button>
              </div>
            </div>
          </div>

          <div class="row">
            <button id="swap" type="button">Swap</button>
            <button id="reset" type="button">Clear both</button>
          </div>

          <h2>Layout</h2>
          <label class="muted">Split
            <select id="orientation">
              <option value="horizontal">Left and right</option>
              <option value="vertical">Top and bottom</option>
            </select>
          </label>
          <label class="muted">Frame
            <select id="aspect"></select>
          </label>
          <label class="muted">Still divider position <span id="split-value"></span>
            <input id="split" type="range" min="0" max="100" step="1" />
          </label>
          <div class="check"><input id="show-divider" type="checkbox" checked /><label for="show-divider">Show divider line</label></div>
          <div class="check"><input id="show-labels" type="checkbox" checked /><label for="show-labels">Show labels</label></div>
          <label class="muted">Label position
            <select id="label-pos">
              <option value="top">Top</option>
              <option value="bottom">Bottom</option>
            </select>
          </label>
          <label class="muted">Before label <input id="label-before" type="text" maxlength="20" value="Before" /></label>
          <label class="muted">After label <input id="label-after" type="text" maxlength="20" value="After" /></label>
          <label class="muted">Caption (optional) <input id="caption" type="text" maxlength="60" placeholder="e.g. 12 weeks in" /></label>
          <div>
            <p class="muted" style="margin: 0 0 6px">Background (shows behind photos set to “Show whole”)</p>
            <div class="swatches" id="bg-swatches">
              <button class="swatch" type="button" data-bg="#0e1a2e" style="background:#0e1a2e" aria-label="Navy" aria-pressed="true"></button>
              <button class="swatch" type="button" data-bg="#000000" style="background:#000" aria-label="Black" aria-pressed="false"></button>
              <button class="swatch" type="button" data-bg="#f6f4ef" style="background:#f6f4ef" aria-label="White" aria-pressed="false"></button>
            </div>
          </div>

          <h2>Animation</h2>
          <label class="muted">Style
            <select id="style">
              <option value="wipe">Wipe across</option>
              <option value="fade">Fade</option>
            </select>
          </label>
          <label class="muted">Ending
            <select id="end">
              <option value="after">After photo only</option>
              <option value="both">Both photos side by side</option>
            </select>
          </label>
          <label class="muted">Length <span id="length-value"></span>
            <input id="length" type="range" min="3" max="10" step="0.5" />
          </label>

          <div class="actions">
            <button id="png" class="primary" type="button">Save still (PNG)</button>
            <button id="preview" type="button">Preview animation</button>
            <button id="clip" type="button">Record animation</button>
          </div>
          <p id="msg" role="status" aria-live="polite"></p>
        </aside>

        <section class="preview" aria-label="Preview">
          <div class="mode" role="group" aria-label="Drag on the preview to">
            <button type="button" data-mode="divider" aria-pressed="true">Move divider</button>
            <button type="button" data-mode="before" aria-pressed="false">Move before photo</button>
            <button type="button" data-mode="after" aria-pressed="false">Move after photo</button>
          </div>
          <canvas id="canvas" width="1080" height="1920" aria-label="Before and after preview"></canvas>
          <p class="hint" id="hint">Drag across the preview to move the divider.</p>
        </section>
      </div>
    </div>

    <script type="module">
      import {
        ASPECTS, PHOTO_DEFAULTS, clamp, placeImage, panRange, timelineTimes, splitAt, fadeAt, panelAt, labelSize, SPLIT_DEFAULT,
      } from './model.mjs?v=5994c93b';

      const $ = (id) => document.getElementById(id);
      const canvas = $('canvas');
      const ctx = canvas.getContext('2d');
      const SLOTS = ['before', 'after'];
      const photos = { before: null, after: null };
      const urls = { before: null, after: null };
      const adj = { before: { ...PHOTO_DEFAULTS }, after: { ...PHOTO_DEFAULTS } };
      const opt = {
        aspect: '9:16',
        orientation: 'horizontal',
        split: SPLIT_DEFAULT,
        showDivider: true,
        showLabels: true,
        labelPos: 'top',
        bg: '#0e1a2e',
        style: 'wipe',
        end: 'after',
        length: 5,
        mode: 'divider',
      };
      let recording = false;
      window.TimSocialEditor = Object.freeze({ isBusy: () => recording });
      const fontFamily = getComputedStyle(document.body).fontFamily;

      for (const [key, info] of Object.entries(ASPECTS)) $('aspect').add(new Option(info.label + ' (' + key + ')', key));

      function say(text, isError) {
        $('msg').textContent = text;
        $('msg').classList.toggle('err', !!isError);
      }

      function frame() {
        return ASPECTS[opt.aspect];
      }

      function ensureCanvasSize() {
        const { width, height } = frame();
        if (canvas.width !== width) canvas.width = width;
        if (canvas.height !== height) canvas.height = height;
      }

      // Draws a photo into the rectangle at (x, y) with size W x H, clipped to that rectangle.
      function drawPhoto(slot, W, H, x = 0, y = 0) {
        const img = photos[slot];
        if (!img || W <= 0 || H <= 0) return;
        const a = adj[slot];
        const p = placeImage(img.naturalWidth, img.naturalHeight, W, H, a);
        const odd = p.rotation % 180 !== 0;
        const uw = odd ? p.h : p.w; // size before the quarter turn
        const uh = odd ? p.w : p.h;
        ctx.save();
        ctx.beginPath();
        ctx.rect(x, y, W, H);
        ctx.clip();
        ctx.translate(x + p.x + p.w / 2, y + p.y + p.h / 2);
        ctx.rotate((p.rotation * Math.PI) / 180);
        ctx.drawImage(img, -uw / 2, -uh / 2, uw, uh);
        ctx.restore();
      }

      function chip(text, x, y, font, pad, alignRight) {
        ctx.font = `700 ${font}px ${fontFamily}`;
        ctx.textBaseline = 'top';
        const label = text.toUpperCase();
        const w = ctx.measureText(label).width + pad * 2;
        const h = font * 1.5;
        const left = alignRight ? x - w : x;
        ctx.fillStyle = 'rgba(14, 26, 46, 0.88)';
        ctx.fillRect(left, y, w, h);
        ctx.fillStyle = '#e8c96a';
        ctx.fillText(label, left + pad, y + font * 0.22);
      }

      // Draws the frame. wipeSplit: 1 = all Before, 0 = all After. fadeAmount: 0 = all Before, 1 = all After.
      // panelSplit: both photos side by side, each in its own half (0.5 = the middle).
      function drawFrame({ wipeSplit = null, fadeAmount = null, panelSplit = null, showDivider = opt.showDivider } = {}) {
        ensureCanvasSize();
        const { width: W, height: H } = frame();
        const horizontal = opt.orientation === 'horizontal';
        ctx.fillStyle = opt.bg;
        ctx.fillRect(0, 0, W, H);
        const boundary = horizontal ? W * clamp(wipeSplit ?? opt.split, 0, 1) : H * clamp(wipeSplit ?? opt.split, 0, 1);

        if (panelSplit !== null) {
          const b = clamp(panelSplit, 0, 1);
          if (horizontal) {
            drawPhoto('before', W * b, H, 0, 0);
            drawPhoto('after', W * (1 - b), H, W * b, 0);
          } else {
            drawPhoto('before', W, H * b, 0, 0);
            drawPhoto('after', W, H * (1 - b), 0, H * b);
          }
        } else if (fadeAmount !== null) {
          // Fade: After fades in over Before.
          drawPhoto('before', W, H);
          if (photos.after && fadeAmount > 0) {
            ctx.save();
            ctx.globalAlpha = clamp(fadeAmount, 0, 1);
            drawPhoto('after', W, H);
            ctx.restore();
          }
        } else {
          // Before fills the first part of the frame (left or top), After the rest.
          ctx.save();
          ctx.beginPath();
          if (horizontal) ctx.rect(0, 0, boundary, H);
          else ctx.rect(0, 0, W, boundary);
          ctx.clip();
          drawPhoto('before', W, H);
          ctx.restore();
          ctx.save();
          ctx.beginPath();
          if (horizontal) ctx.rect(boundary, 0, W - boundary, H);
          else ctx.rect(0, boundary, W, H - boundary);
          ctx.clip();
          drawPhoto('after', W, H);
          ctx.restore();
        }

        const lineAt = panelSplit !== null
          ? (horizontal ? W * clamp(panelSplit, 0, 1) : H * clamp(panelSplit, 0, 1))
          : boundary;
        const lineAllowed = panelSplit !== null || fadeAmount === null;
        const showLine = showDivider && photos.before && photos.after && lineAllowed && lineAt > 0 && (horizontal ? lineAt < W : lineAt < H);
        if (showLine) {
          ctx.fillStyle = '#e8c96a';
          const t = W * 0.008;
          if (horizontal) ctx.fillRect(lineAt - t / 2, 0, t, H);
          else ctx.fillRect(0, lineAt - t / 2, W, t);
          const r = Math.min(W, H) * 0.035;
          const cx = horizontal ? lineAt : W / 2;
          const cy = horizontal ? H / 2 : lineAt;
          ctx.beginPath();
          ctx.arc(cx, cy, r, 0, Math.PI * 2);
          ctx.fill();
        }

        const size = labelSize(W, H);
        const top = opt.labelPos === 'top';
        if (opt.showLabels) {
          const y = top ? size.pad : (horizontal ? H - size.pad - size.font * 1.5 : H - size.pad - size.font * 1.5);
          if (photos.before) chip(($('label-before').value || 'Before'), size.pad, y, size.font, size.pad, false);
          if (photos.after) {
            if (horizontal) chip(($('label-after').value || 'After'), W - size.pad, y, size.font, size.pad, true);
            else chip(($('label-after').value || 'After'), size.pad, top ? H - size.pad - size.font * 1.5 : size.pad, size.font, size.pad, false);
          }
        }
        const caption = $('caption').value.trim();
        if (caption && photos.before && photos.after) {
          ctx.font = `700 ${size.font * 1.1}px ${fontFamily}`;
          ctx.textBaseline = 'middle';
          ctx.textAlign = 'center';
          ctx.fillStyle = 'rgba(14, 26, 46, 0.88)';
          const bar = size.font * 2.6;
          ctx.fillRect(0, H - bar, W, bar);
          ctx.fillStyle = '#f6f4ef';
          ctx.fillText(caption, W / 2, H - bar / 2, W * 0.94);
          ctx.textAlign = 'start';
        }
      }

      function drawStill() {
        drawFrame({ wipeSplit: opt.split });
        if (!photos.before && !photos.after) {
          const { width: W, height: H } = frame();
          ctx.fillStyle = '#9fb0c8';
          ctx.font = `700 ${Math.round(Math.min(W, H) * 0.045)}px ${fontFamily}`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('Add a before and an after photo', W / 2, H / 2);
          ctx.textAlign = 'start';
        }
      }

      function setPressed(selector, attr, value) {
        document.querySelectorAll(selector).forEach((b) => b.setAttribute('aria-pressed', String(b.dataset[attr] === value)));
      }

      function syncControls() {
        $('split-value').textContent = Math.round(opt.split * 100) + '%';
        $('split').value = Math.round(opt.split * 100);
        $('orientation').value = opt.orientation;
        $('aspect').value = opt.aspect;
        $('show-divider').checked = opt.showDivider;
        $('show-labels').checked = opt.showLabels;
        $('label-pos').value = opt.labelPos;
        $('style').value = opt.style;
        $('end').value = opt.end;
        $('length-value').textContent = opt.length.toFixed(1) + ' s';
        $('length').value = opt.length;
        setPressed('[data-bg]', 'bg', opt.bg);
        setPressed('[data-mode]', 'mode', opt.mode);
        for (const slot of SLOTS) {
          const a = adj[slot];
          $('zoom-' + slot).value = Math.round(a.zoom * 100);
          $('zoom-' + slot + '-v').textContent = Math.round(a.zoom * 100) + '%';
          $('panx-' + slot).value = Math.round(a.panX * 100);
          $('panx-' + slot + '-v').textContent = Math.round(a.panX * 100);
          $('pany-' + slot).value = Math.round(a.panY * 100);
          $('pany-' + slot + '-v').textContent = Math.round(a.panY * 100);
          document.querySelectorAll(`[data-fit="${slot}"]`).forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.value === a.fit)));
          const t = $('thumb-' + slot);
          t.classList.toggle('has', !!photos[slot]);
          t.style.backgroundImage = urls[slot] ? `url("${urls[slot]}")` : '';
        }
        const ready = !!(photos.before && photos.after);
        $('png').disabled = !ready || recording;
        $('preview').disabled = !ready || recording;
        $('clip').disabled = !ready || recording;
        $('swap').disabled = recording;
        $('reset').disabled = recording;
        $('aspect').disabled = recording;
        canvas.classList.toggle('busy', recording);
        canvas.classList.toggle('grab', opt.mode !== 'divider');
        $('hint').textContent = opt.mode === 'divider'
          ? 'Drag across the preview to move the divider.'
          : 'Drag the preview to move the ' + opt.mode + ' photo. Use the sliders for fine control.';
      }

      function refresh() {
        if (!recording) drawStill();
        syncControls();
      }

      // Phone photos are often 12 megapixels or more. Shrinking them once keeps the preview and recording smooth on iPhone.
      const MAX_SIDE = 2048;
      function loadImage(url) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = reject;
          img.src = url;
        });
      }

      async function shrink(img, url) {
        const scale = Math.min(1, MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
        if (scale >= 1) return { img, url, original: true };
        try {
          const c = document.createElement('canvas');
          c.width = Math.round(img.naturalWidth * scale);
          c.height = Math.round(img.naturalHeight * scale);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          const blob = await new Promise((resolve, reject) => c.toBlob((b) => (b ? resolve(b) : reject(new Error('no blob'))), 'image/jpeg', 0.92));
          const smallUrl = URL.createObjectURL(blob);
          return { img: await loadImage(smallUrl), url: smallUrl, original: false };
        } catch {
          return { img, url, original: true };
        }
      }

      async function loadPhoto(file, slot) {
        if (!file) return;
        const nameEl = $('name-' + slot);
        const src = URL.createObjectURL(file);
        let result;
        try {
          // decode() can reject on some phones even when the photo displays, so the load event is what counts.
          const img = await loadImage(src);
          await img.decode().catch(() => {});
          result = await shrink(img, src);
        } catch {
          URL.revokeObjectURL(src);
          nameEl.textContent = 'Could not open this photo. Try a JPEG or PNG.';
          nameEl.classList.add('err');
          say('Could not open the ' + slot + ' photo. Try a JPEG or PNG.', true);
          return;
        }
        if (!result.original) URL.revokeObjectURL(src);
        if (urls[slot]) URL.revokeObjectURL(urls[slot]);
        photos[slot] = result.img;
        urls[slot] = result.url;
        adj[slot] = { ...PHOTO_DEFAULTS };
        nameEl.textContent = file.name;
        nameEl.classList.remove('err');
        say('');
        refresh();
      }

      for (const slot of SLOTS) {
        $('file-' + slot).onchange = (e) => loadPhoto(e.target.files[0], slot);
        $('zoom-' + slot).oninput = (e) => { adj[slot].zoom = clamp(Number(e.target.value) / 100, 1, 3); refresh(); };
        $('panx-' + slot).oninput = (e) => { adj[slot].panX = clamp(Number(e.target.value) / 100, -1, 1); refresh(); };
        $('pany-' + slot).oninput = (e) => { adj[slot].panY = clamp(Number(e.target.value) / 100, -1, 1); refresh(); };
      }
      document.querySelectorAll('[data-fit]').forEach((b) => {
        b.onclick = () => { adj[b.dataset.fit].fit = b.dataset.value; refresh(); };
      });
      document.querySelectorAll('[data-rotate]').forEach((b) => {
        b.onclick = () => { const a = adj[b.dataset.rotate]; a.rotation = (a.rotation + 90) % 360; refresh(); };
      });
      document.querySelectorAll('[data-reset]').forEach((b) => {
        b.onclick = () => { adj[b.dataset.reset] = { ...PHOTO_DEFAULTS }; refresh(); };
      });
      document.querySelectorAll('[data-bg]').forEach((b) => {
        b.onclick = () => { opt.bg = b.dataset.bg; refresh(); };
      });
      document.querySelectorAll('[data-mode]').forEach((b) => {
        b.onclick = () => { opt.mode = b.dataset.mode; refresh(); };
      });

      $('swap').onclick = () => {
        [photos.before, photos.after] = [photos.after, photos.before];
        [urls.before, urls.after] = [urls.after, urls.before];
        [adj.before, adj.after] = [adj.after, adj.before];
        refresh();
      };
      $('reset').onclick = () => {
        if (!confirm('Clear both photos and their settings?')) return;
        for (const slot of SLOTS) {
          if (urls[slot]) URL.revokeObjectURL(urls[slot]);
          photos[slot] = null;
          urls[slot] = null;
          adj[slot] = { ...PHOTO_DEFAULTS };
          $('name-' + slot).textContent = 'No photo yet';
          $('name-' + slot).classList.remove('err');
        }
        say('');
        refresh();
      };
      $('orientation').onchange = (e) => { opt.orientation = e.target.value; refresh(); };
      $('aspect').onchange = (e) => { opt.aspect = e.target.value; refresh(); };
      $('split').oninput = (e) => { opt.split = clamp(Number(e.target.value) / 100, 0, 1); refresh(); };
      $('show-divider').onchange = (e) => { opt.showDivider = e.target.checked; refresh(); };
      $('show-labels').onchange = (e) => { opt.showLabels = e.target.checked; refresh(); };
      $('label-pos').onchange = (e) => { opt.labelPos = e.target.value; refresh(); };
      $('style').onchange = (e) => { opt.style = e.target.value; syncControls(); };
      $('end').onchange = (e) => { opt.end = e.target.value; syncControls(); };
      $('length').oninput = (e) => { opt.length = Number(e.target.value); syncControls(); };
      ['label-before', 'label-after', 'caption'].forEach((id) => $(id).addEventListener('input', refresh));

      // Dragging on the preview: move the divider, or pan the chosen photo.
      let drag = null;
      function pointerToFrame(e) {
        const rect = canvas.getBoundingClientRect();
        const sx = canvas.width / rect.width;
        const sy = canvas.height / rect.height;
        return { x: (e.clientX - rect.left) * sx, y: (e.clientY - rect.top) * sy, rect };
      }
      canvas.addEventListener('pointerdown', (e) => {
        if (recording) return;
        const { x, y, rect } = pointerToFrame(e);
        const { width: W, height: H } = frame();
        if (opt.mode === 'divider') {
          if (!(photos.before && photos.after)) return;
          drag = { kind: 'divider' };
          opt.split = clamp(opt.orientation === 'horizontal' ? x / W : y / H, 0, 1);
          refresh();
        } else {
          const slot = opt.mode;
          if (!photos[slot]) return;
          drag = { kind: 'photo', slot, lastX: x, lastY: y, rect };
        }
        canvas.setPointerCapture(e.pointerId);
      });
      canvas.addEventListener('pointermove', (e) => {
        if (!drag) return;
        const { x, y } = pointerToFrame(e);
        const { width: W, height: H } = frame();
        if (drag.kind === 'divider') {
          opt.split = clamp(opt.orientation === 'horizontal' ? x / W : y / H, 0, 1);
          refresh();
          return;
        }
        const img = photos[drag.slot];
        const a = adj[drag.slot];
        const range = panRange(img.naturalWidth, img.naturalHeight, W, H, a);
        const dx = x - drag.lastX;
        const dy = y - drag.lastY;
        drag.lastX = x;
        drag.lastY = y;
        if (range.x > 0) a.panX = clamp(a.panX + dx / range.x, -1, 1);
        if (range.y > 0) a.panY = clamp(a.panY + dy / range.y, -1, 1);
        refresh();
      });
      const endDrag = () => { drag = null; };
      canvas.addEventListener('pointerup', endDrag);
      canvas.addEventListener('pointercancel', endDrag);

      // Delivery: the iPad share sheet when it can take a file, otherwise a normal download.
      async function deliver(blob, name) {
        const file = new File([blob], name, { type: blob.type });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({ files: [file], title: name });
            return 'Shared ' + name + '.';
          } catch (e) {
            if (e.name === 'AbortError') return 'Not saved.';
          }
        }
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
        return 'Downloaded ' + name + '.';
      }

      function stem() {
        const base = ($('caption').value || 'before-after').trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
        return (base || 'before-after') + '-' + opt.aspect.replace(':', 'x');
      }

      $('png').onclick = () => {
        drawStill();
        canvas.toBlob(async (blob) => {
          if (!blob) return say('Could not make the PNG in this browser.', true);
          say(await deliver(blob, stem() + '.png'));
        }, 'image/png');
      };

      function pickType() {
        if (!window.MediaRecorder) return null;
        const list = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
        for (const type of list) {
          try {
            if (MediaRecorder.isTypeSupported(type)) return type;
          } catch {
            /* keep looking */
          }
        }
        return '';
      }

      // The animation ends on After alone, or with both photos side by side, each in its own half.
      function animationFrame(t) {
        const panel = opt.end === 'both' ? panelAt(t, opt.length) : null;
        if (panel !== null) return drawFrame({ panelSplit: panel });
        if (opt.style === 'fade') drawFrame({ fadeAmount: fadeAt(t, opt.length) });
        else drawFrame({ wipeSplit: splitAt(t, opt.length) });
      }

      // Plays the animation on the preview only. Nothing is saved.
      $('preview').onclick = () => {
        if (!(photos.before && photos.after) || recording) return;
        const total = timelineTimes(opt.length).total;
        recording = true;
        syncControls();
        const start = performance.now();
        const step = () => {
          const t = (performance.now() - start) / 1000;
          animationFrame(t);
          if (t < total) return requestAnimationFrame(step);
          recording = false;
          refresh();
          say('Preview finished. Record animation to save it.');
        };
        say('Previewing ' + total.toFixed(1) + ' s…');
        step();
      };

      $('clip').onclick = () => {
        if (!(photos.before && photos.after)) return;
        const type = pickType();
        if (type === null || !canvas.captureStream) return say('This browser cannot record video. Save the PNG instead, or open this page in a newer Safari or in Chrome on a computer.', true);
        let mr, stream, raf = 0;
        const cleanup = () => {
          cancelAnimationFrame(raf);
          stream?.getTracks().forEach((track) => track.stop());
        };
        const chunks = [];
        try {
          stream = canvas.captureStream(30);
          mr = new MediaRecorder(stream, type ? { mimeType: type, videoBitsPerSecond: 8e6 } : { videoBitsPerSecond: 8e6 });
        } catch (e) {
          cleanup();
          return say('Recording could not start (' + e.name + ').', true);
        }
        recording = true;
        activeRecorder = mr;
        interrupted = false;
        syncControls();
        const total = timelineTimes(opt.length).total;
        const start = performance.now();
        const step = () => {
          if (mr.state === 'inactive') return;
          const t = (performance.now() - start) / 1000;
          animationFrame(t);
          if (t < total) raf = requestAnimationFrame(step);
          else if (mr.state !== 'inactive') mr.stop();
        };
        mr.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
        let failure = '', finished = false;
        const finish = async () => {
          if (finished) return;
          finished = true;
          cleanup();
          recording = false;
          activeRecorder = null;
          refresh();
          if (failure) return say(failure, true);
          if (interrupted) return say('Recording stopped because Safari went to the background. Keep this page open while recording.', true);
          const size = chunks.reduce((n, c) => n + c.size, 0);
          if (!size) return say('The recording came out empty. Try again.', true);
          const mt = (mr.mimeType || type || 'video/webm').split(';')[0];
          const ext = mt.includes('mp4') ? 'mp4' : 'webm';
          say('Saving the animation…');
          say(await deliver(new Blob(chunks, { type: mt }), stem() + '.' + ext));
        };
        mr.onstop = finish;
        mr.onerror = () => {
          failure = 'Recording was interrupted. Try again with this page open.';
          if (mr.state !== 'inactive') mr.stop();
          else finish();
        };
        try {
          mr.start(500);
          say('Recording ' + total.toFixed(1) + ' s. Keep this page open with the screen on.');
          step();
        } catch (e) {
          failure = 'Recording could not start (' + e.name + ').';
          if (mr.state !== 'inactive') mr.stop();
          else finish();
        }
      };

      // On iPhone, switching apps can break a recording, so stop it cleanly and say why.
      let activeRecorder = null;
      let interrupted = false;
      document.addEventListener('visibilitychange', () => {
        if (document.hidden && activeRecorder && activeRecorder.state !== 'inactive') {
          interrupted = true;
          activeRecorder.stop();
        }
      });

      refresh();
    </script>
  </body>
</html>
