<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0e1a2e" />
    <title>Content Studio · T.IM Studio</title>
    <link rel="icon" href="../favicon.svg" />
    <link rel="stylesheet" href="../shared/fonts.css" />
    <link rel="stylesheet" href="studio.css" />
    <script src="studio.js" defer></script>
    <script type="module" src="supabase-sync.mjs"></script>
  <link rel="stylesheet" href="../shared/studio-bar.css" /><script type="module" src="../shared/studio-bar.mjs"></script></head>
  <body><tim-studio-bar></tim-studio-bar>
    <header>
      <h1>Content Studio</h1>
      <p class="intro">From your first idea to a finished video.</p>
      <nav aria-label="Planning view">
        <a href="../idea-vault/" data-mode="ideas">Ideas</a>
        <a href="../content-planner/" data-mode="projects">Projects</a>
      </nav>
      <p id="hint"
        >Choose Create from idea to turn a captured idea into a video plan.</p
      >
      <p id="status" role="status" aria-live="polite"></p>
      <a
        id="standalone"
        href="../content-planner/"
        target="_blank"
        rel="noopener"
        >Open this view in a new tab ↗</a
      >
    </header>
    <details id="studio-sync">
      <summary>Workspace cloud sync</summary>
      <form>
        <label>Loadout email <input type="email" name="email" autocomplete="email" required /></label>
        <button>Send sign-in link</button>
      </form>
      <button type="button" data-sync hidden>Sync now</button>
      <button type="button" data-disconnect hidden>Disconnect this browser</button>
      <p role="status">Checking cloud connection…</p>
    </details>
    <main id="editors" aria-label="Planning workspace"></main>
    <noscript><p>Choose a view above to open its planner.</p></noscript>
  </body>
</html>
