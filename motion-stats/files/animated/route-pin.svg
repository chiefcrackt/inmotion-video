<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 240 320" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Route pin"><title>Route pin</title><style>
@keyframes pulse{0%,100%{transform:scale(.9);opacity:.65}50%{transform:scale(1);opacity:1}}
@keyframes nudge{0%,100%{transform:translateX(-6px)}50%{transform:translateX(6px)}}
@keyframes left{0%,100%{transform:translateX(6px)}50%{transform:translateX(-6px)}}
@keyframes slide{0%,100%{transform:translateX(-8px);opacity:.65}50%{transform:translateX(0);opacity:1}}
@keyframes rise{0%,100%{transform:translateY(7px);opacity:.65}50%{transform:translateY(0);opacity:1}}
@keyframes fall{0%,100%{transform:translateY(-7px)}50%{transform:translateY(7px)}}
@keyframes turn{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@keyframes reveal{0%,100%{transform:scaleX(.65)}50%{transform:scaleX(1)}}
@keyframes fade{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes dash{to{stroke-dashoffset:-72}}
.m-pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:view-box}
.m-nudge{animation:nudge 2.4s ease-in-out infinite;transform-box:view-box}
.m-left{animation:left 2.4s ease-in-out infinite;transform-box:view-box}
.m-slide{animation:slide 2.4s ease-in-out infinite;transform-box:view-box}
.m-rise{animation:rise 2.4s ease-in-out infinite;transform-box:view-box}
.m-fall{animation:fall 2.4s ease-in-out infinite;transform-box:view-box}
.m-turn{animation:turn 3s ease-in-out infinite alternate;transform-box:view-box}
.m-reveal{animation:reveal 2.4s ease-in-out infinite;transform-box:view-box}
.m-fade{animation:fade 2.4s ease-in-out infinite;transform-box:view-box}
.m-dash{animation:dash 2.4s ease-in-out infinite;transform-box:view-box}
@media(prefers-reduced-motion:reduce){g{animation:none!important}}</style><g id="halo" class="m-pulse" style="transform-origin:120px 276px;animation-delay:-0s"><ellipse cx="120" cy="276" rx="72" ry="19" stroke="#2e9bad" stroke-width="7"/></g><g id="pin" class="m-rise" style="transform-origin:120px 160px;animation-delay:-0.3s"><path d="M120 26a76 76 0 0 0-76 76c0 66 76 157 76 157s76-91 76-157a76 76 0 0 0-76-76z" fill="#e8c96a" stroke="#0e1a2e" stroke-width="9"/></g><g id="centre" class="m-rise" style="transform-origin:120px 160px;animation-delay:-0.6s"><circle cx="120" cy="105" r="29" fill="#2e9bad" stroke="#0e1a2e" stroke-width="7"/></g></svg>
